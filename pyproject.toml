[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contextgru"
version = "0.1.0"
description = "Context-aware GRU models for Carnatic svara representation"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE.md" }
authors = [
    { name = "Thomas Nuttall" },
    { name = "Vivek Vijayan" },
    { name = "Xavier Serra" },
    { name = "Lara Pearson" },
]
keywords = [
    "carnatic music",
    "svara representation",
    "melodic context",
    "coarticulation",
    "music information retrieval",
]
dependencies = [
    "numpy==1.26.4",
    "scikit-learn",
    "torch",
]

[project.urls]
Repository = "https://github.com/vivekvjyn/ContextGRU"
Paper = "https://doi.org/10.5281/zenodo.17497901"

[project.scripts]
contextgru = "contextgru.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
